name: Epic
description: Ein grösseres Vorhaben, das in mehrere Teilaufgaben zerlegt wird
title: "[Epic] "
labels: ["epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Was soll durch dieses Epic erreicht werden?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Kontext / Hintergrund
      description: Warum ist das wichtig? Gibt es Vorgaben oder Einschränkungen?
  - type: textarea
    id: user_stories
    attributes:
      label: User Stories
      description: Wer möchte was und warum? (eine Story pro Zeile)
      value: |
        - Als ... möchte ich ..., damit ...
  - type: textarea
    id: tasks
    attributes:
      label: Teilaufgaben
      description: Checkliste der Teilaufgaben. Sobald Sub-Issues erstellt sind, hier mit "#<Issue-Nummer>" verlinken.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      description: Wann gilt das Epic als abgeschlossen?
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Was gehört explizit NICHT zu diesem Epic?
